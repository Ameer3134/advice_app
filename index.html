<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class=" flex flex-col items-center justify-center text-center bg-gray-800 text-white p-5 ">
    <header>
        <h1 class="text-3xl my-4  text-gray-200 font-bold p-3 rounded-xl">Advice Generator App</h1>
    </header>

    <main>
        <section class="bg-gray-700 sm:w-[50%] flex flex-col gap-3 mx-auto p-5 ">
            <div><p class="adviceId  text-sm text-green-400 ">ADVICE ID</p></div>

            <div>
                <p class="advice text-[28px]">
                    Click the button below to get motivated
            </p>
            </div>

            <!-- thin line image -->

            <div class="mx-auto my-5"><img src="./images/pattern-divider-desktop.svg" alt="a thin line"></div>
        </section>
        <!-- button -->
        <div class="bg-green-400 p-3 rounded-full w-13 h-13 relative z-0 bottom-5 mx-auto"><button class="btn "><img src="./images/icon-dice.svg" alt="a dice"></button></div>
    </main>



    <script src="./index.js"></script>
</body>
</html>
